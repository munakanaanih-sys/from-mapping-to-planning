<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>من المسح الصفي إلى خطة التدخل – ومضات ذكية مع منى مصطفى</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--ink:#1e3a5f;--mut:#6b7280;--line:#e5e7eb;--or:#f97316;--teal:#0d9488;--cl:#D97757;--gold:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',system-ui,sans-serif;background:linear-gradient(135deg,#f0f9ff 0%,#fdf4ff 50%,#fff7ed 100%);min-height:100vh;color:#1f2937;line-height:1.6}
.fade-in{animation:fadeIn .4s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* splash */
.splash{min-height:100vh;background:linear-gradient(145deg,#0f2749 0%,#1e3a5f 40%,#1a4060 70%,#0f2749 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;position:relative;overflow:hidden;text-align:center}
.blob{position:absolute;border-radius:50%;pointer-events:none}.b1{top:-80px;right:-80px;width:400px;height:400px;background:radial-gradient(circle,rgba(249,115,22,.18),transparent 70%)}
.b2{bottom:-100px;left:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(59,130,246,.15),transparent 70%)}.b3{top:40%;left:5%;width:200px;height:200px;background:radial-gradient(circle,rgba(139,92,246,.12),transparent 70%)}
.sp-head{position:relative;z-index:1;margin-bottom:40px}
.sp-logo{width:130px;height:130px;border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05));border:2px solid rgba(255,255,255,.25);box-shadow:0 12px 40px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;overflow:hidden}
.sp-logo img{width:112px;height:112px;border-radius:20px;object-fit:cover}
.splash h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:900;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.4);line-height:1.25;margin-bottom:8px}
.gold{font-size:1.1rem;font-weight:800;color:var(--gold)}.gold.he{font-size:.85rem;opacity:.75;font-weight:700}
.sp-badge{display:inline-block;margin-top:16px;padding:9px 22px;border-radius:50px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);font-size:.85rem;font-weight:600}
.sp-card{background:rgba(255,255,255,.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:28px;padding:34px 30px;max-width:600px;width:100%;position:relative;z-index:1;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.sp-card p{color:rgba(255,255,255,.75);font-weight:600;margin-bottom:26px}
.sp-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.sp-btns button{flex:1;min-width:130px;max-width:180px;padding:18px 14px;border-radius:20px;color:#fff;font:inherit;font-weight:800;font-size:1.05rem;border:none;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:all .25s;display:flex;flex-direction:column;align-items:center;gap:6px}
.sp-btns button:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(0,0,0,.45)}.sp-btns span{font-size:1.6rem}
.sp-foot{margin-top:36px;color:rgba(255,255,255,.3);font-size:.78rem;font-weight:600;position:relative;z-index:1}
/* page */
.page{max-width:900px;margin:0 auto;background:rgba(255,255,255,.97);box-shadow:0 4px 40px rgba(0,0,0,.15);min-height:100vh}
.site-header{background:linear-gradient(135deg,#1e3a5f 0%,#0f2749 60%,#162040 100%);padding:22px 20px 24px;display:flex;justify-content:center;position:relative;overflow:hidden}
.site-header::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 50%,rgba(249,115,22,.15),transparent 60%),radial-gradient(circle at 70% 50%,rgba(59,130,246,.12),transparent 60%)}
.sh-text{position:relative;z-index:1;text-align:center}
.sh-logo{width:86px;height:86px;border-radius:18px;object-fit:cover;border:2px solid rgba(255,255,255,.2);box-shadow:0 6px 24px rgba(0,0,0,.35);display:block;margin:0 auto 10px}
.sh-title{font-size:1.5rem;font-weight:900;color:#fff;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.sh-sub{font-size:1rem;font-weight:800;color:var(--gold);margin-top:6px}
.lang-switch{display:inline-flex;gap:4px;padding:4px;border-radius:50px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);margin:0 auto 14px}
.ls-btn{border:none;background:transparent;color:rgba(255,255,255,.85);font:inherit;font-weight:700;font-size:.82rem;padding:5px 14px;border-radius:50px;cursor:pointer}
.ls-btn:hover{background:rgba(255,255,255,.15)}.ls-btn.on{background:var(--gold);color:#0f2749}
main{padding:22px 18px 10px}
.intro{color:#475569;font-size:.95rem;text-align:center;max-width:680px;margin:0 auto 18px}
.card{background:#fff;border:1px solid #eef2f7;border-radius:20px;box-shadow:0 4px 18px rgba(15,23,42,.06);padding:20px;margin-bottom:16px}
.card h2{margin-bottom:12px;font-size:1.12rem;color:var(--ink);font-weight:900;display:flex;gap:8px;align-items:center}
.n{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#f97316,#fbbf24);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;flex:0 0 30px}
h4{margin:18px 0 4px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:620px){.grid2{grid-template-columns:1fr}}
label{display:block;font-weight:700;font-size:.9rem;color:#374151;margin-top:6px}
input,select,textarea{width:100%;margin-top:4px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;font:inherit;font-weight:400;background:#fff;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
.opt{color:var(--mut);font-weight:400;font-size:.8rem}.muted{color:var(--mut);font-size:.85rem;margin-top:6px}
.ok{color:#15803d;font-weight:700;margin:8px 0}.err,.warn{color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:8px 12px;font-size:.9rem;margin-top:8px}
.stage{margin-top:12px}.badge{display:inline-block;padding:5px 12px;border-radius:999px;font-weight:700;font-size:.85rem}
.b-elem{background:#ecfdf5;color:#047857}.b-mid{background:#eff6ff;color:#1d4ed8}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;font:inherit;font-weight:700;cursor:pointer}.pill.on{border-color:var(--or);background:#fff7ed;color:#c2410c}
.link{background:none;border:none;color:var(--teal);font:inherit;font-weight:700;cursor:pointer;padding:4px}
table{width:100%;border-collapse:collapse;margin-top:8px}th{font-size:.8rem;color:var(--mut);text-align:start;padding:4px}td{padding:3px}
td input{margin:0;padding:7px 9px}.sw{display:inline-block;width:18px;height:18px;border-radius:5px}.bt td:first-child{width:28px}
.qwrap{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px 8px;margin-top:6px}
.qt td:first-child{width:48px}.qt .bl{width:24%}.qt .mx{width:70px}.qt tr.sech td{background:#f1f5f9;font-weight:800;color:var(--ink);font-size:.82rem;padding:5px 8px;border-radius:8px}.qt tr.miss td{background:#fff7ed}
.progs{display:grid;gap:10px}.prow{display:grid;grid-template-columns:2fr 1fr 1.5fr 1.5fr auto;gap:8px;align-items:end;border:1px solid var(--line);border-radius:14px;padding:10px}.prow label{font-size:.8rem}
@media(max-width:620px){.prow{grid-template-columns:1fr 1fr}.prow .x{grid-column:1/-1;justify-self:end}}
.x{border:none;background:#fee2e2;color:#b91c1c;border-radius:8px;cursor:pointer;padding:6px 9px}
.drop{border:2px dashed #f59e0b;border-radius:16px;padding:18px;text-align:center;cursor:pointer;background:#fffdf7;display:block}.drop:hover{background:#fff7ed}.drop.small{padding:12px}.big{font-size:1.8rem}
.note{color:#1e40af;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:8px 12px;font-size:.9rem;margin:8px 0}
.warn ul{margin:6px 18px}.det{max-height:240px;overflow:auto;font-size:.8rem;background:#fff;border-radius:10px;margin-top:6px}.det table{margin:0}.det td,.det th{padding:3px 6px;border-bottom:1px solid #f1f5f9;color:#374151}details summary{cursor:pointer;color:var(--teal);font-weight:700;margin-top:4px}
.qt td.sec{font-size:.75rem;color:var(--mut);width:70px}
.full{grid-column:1/-1}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.cpick{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-weight:700;cursor:pointer}.cpick.on{border-color:var(--teal);background:#f0fdfa;color:#0f766e}.addcls input{flex:1;margin:0}.addcls{flex-wrap:nowrap}
.chip{display:inline-block;background:#f1f5f9;border-radius:999px;padding:2px 10px;margin:2px;font-size:.85rem}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}@media(max-width:620px){.checks{grid-template-columns:1fr}}
.ck{font-weight:400;display:flex;gap:8px;align-items:center}.ck input{width:auto;margin:0}
.steps{list-style:none;margin:0 0 14px;display:grid;gap:8px}.steps li{display:flex;gap:10px;align-items:flex-start}
.steps span{flex:0 0 26px;height:26px;border-radius:50%;background:var(--cl);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.cta{background:linear-gradient(135deg,#f97316,#fb923c);color:#fff;border:none;border-radius:14px;padding:12px 22px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(249,115,22,.4)}
.cta2{border:2px solid #f3d3c2;color:#9a3412;border-radius:14px;padding:10px 18px;font-weight:800;text-decoration:none;background:#fff}
.copied{color:#15803d;font-weight:700;min-height:1.2em;margin:6px 0}
pre{white-space:pre-wrap;direction:ltr;text-align:left;background:#fff;border:1px solid #f3d3c2;border-radius:12px;padding:12px;max-height:340px;overflow:auto;font-size:.8rem}
.claude{background:linear-gradient(135deg,#fdf6f0,#fff);border:2px solid #f3d3c2}
#tabs{display:flex;gap:8px;margin:6px 0 16px;scroll-margin-top:10px}#tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
#tabs button.on{border-color:var(--teal);background:#f0fdfa;color:#0f766e;box-shadow:0 4px 14px rgba(20,184,166,.2)}#tabs small{display:block;font-weight:400;color:var(--mut)}
footer{text-align:center;color:#9ca3af;font-size:.78rem;padding:12px 0 26px;display:flex;align-items:center;justify-content:center;gap:8px}
.ft-logo{width:22px;height:22px;border-radius:5px;object-fit:cover;opacity:.8}
</style>
</head>

/* traffic-light gradient: red (lowest) → yellow → green (highest), Excel's classic scale */
const TL_FILL=['F8696B','FFEB84','63BE7B'];
const TL_TEXT=['B91C1C','A16207','15803D'];
function lerpHex(a,b,t){
  const pa=[0,2,4].map(i=>parseInt(a.substr(i,2),16)), pb=[0,2,4].map(i=>parseInt(b.substr(i,2),16));
  return pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('').toUpperCase();
}
function traffic(t,stops){
  t=Math.max(0,Math.min(1,t));
  return t<=0.5?lerpHex(stops[0],stops[1],t*2):lerpHex(stops[1],stops[2],(t-0.5)*2);
}
function bandT(bands,i){return bands.length>1?i/(bands.length-1):1;}
function bandLight(bands,i){return traffic(bandT(bands,i),TL_FILL);}               // cell fill (no #)
function bandSoft(bands,i){return lerpHex(bandLight(bands,i),'FFFFFF',0.6);}         // pale version for web backgrounds
function bandColor(bands,i){return '#'+traffic(bandT(bands,i),TL_TEXT);}            // strong text / chart color

/* a band list is [{name,min,max}]: both bounds are inclusive and shown to the teacher (e.g. 55 – 64).
   Classification uses the lower bounds only, so a score that falls between two ranges (e.g. 64.5) counts in the lower one. */
function presetBands(lang,n){
  const p=(BAND_PRESETS[lang]||BAND_PRESETS.ar)[n]||BAND_PRESETS.ar[4];
  return p.map(([name,min],i)=>({name,min,max:i<p.length-1?p[i+1][1]-1:100}));
}
/* older drafts/files stored only lower bounds: derive the upper bound of each range */
function normalizeBands(bands){
  if(!Array.isArray(bands)) return bands;
  return bands.map((b,i)=>{
    if(b.max!==undefined&&b.max!==null&&b.max!=='') return {...b};
    const next=bands[i+1];
    return {...b,max:next?Number(next.min)-1:100};
  });
}
/* the step used to guess the neighbouring bound: 1 for whole numbers, 0.1 otherwise */
function boundStep(v){return Number.isInteger(Number(v))?1:0.1;}
function roundB(v){return Math.round(Number(v)*10)/10;}
function bandTop(bands){const m=bands[bands.length-1].max;return (m===undefined||m===null||m==='')?100:Number(m);}
function bandUpper(bands,i){
  const m=bands[i].max;
  if(m!==undefined&&m!==null&&m!=='') return Number(m);
  return i<bands.length-1?Number(bands[i+1].min)-1:100;
}
/* scores below the lowest bound count in the first band, scores above the top in the last band */
function bandIndex(score,bands){
  let idx=0;
  for(let i=1;i<bands.length;i++){ if(score>=Number(bands[i].min)) idx=i; }
  return idx;
}
/* returns null if valid, otherwise an error key */
function validateBands(bands){
  if(!Array.isArray(bands)||bands.length<4||bands.length>6) return 'count';
  const bad=(v)=>v===''||v===null||v===undefined||isNaN(Number(v))||Number(v)<0||Number(v)>100;
  for(let i=0;i<bands.length;i++){
    const b=bands[i];
    if(!String(b.name||'').trim()) return 'name';
    if(bad(b.min)||bad(bandUpper(bands,i))) return 'range';
    if(bandUpper(bands,i)<Number(b.min)) return 'span';
    if(i>0&&Number(b.min)<=bandUpper(bands,i-1)) return 'order';
  }
  return null;
}
/* indexes i where a gap is left between range i and range i+1 (e.g. 54 → 60) */
function bandGaps(bands){
  const g=[];
  for(let i=0;i<bands.length-1;i++){
    const up=bandUpper(bands,i), nx=Number(bands[i+1].min);
    if(nx-up>boundStep(up)+1e-9) g.push(i);
  }
  return g;
}
function bandRangeLabel(bands,i){return `${Number(bands[i].min)} – ${bandUpper(bands,i)}`;}
function buildDist(scores,bands){
  const counts=bands.map(()=>0);
  scores.forEach(s=>{counts[bandIndex(s,bands)]++;});
  return counts;
}

/* ═══════════ SUBJECT-SPECIFIC SUMMARY-REPORT PROMPT (דוח מסכם) ═══════════
   One prompt per subject (the subject the teacher chose at the start), written in English.
   The teacher attaches the results Excel (the same file uploaded to the platform) to Claude.
   Class names are taken exactly from the sheet names in that file, the ranges (المجالات)
   from its ranges sheet, and classes are grouped into grade levels for per-grade analysis
   plus a comparison between grades. Output language: Arabic for Arabic, Hebrew otherwise. */
const REPORT_INSIGHTS='תובנות והמלצות';
const RULE='══════════════════════════════';

/* grade level from a class sheet name: "ז1","ז A","ז-2","ח'3","سابع أ","7B" → "ז","ז","ז","ח","سابع","7" */
function gradeOfClass(name){
  const m=String(name||'').trim();
  let k=m.replace(/[\s\-_.\/]*\d+$/,'');
  if(k===m) k=m.replace(/[\s\-_.\/]*[A-Za-z]$/,'');
  if(k===m) k=m.replace(/[\s\-_.\/]+[֐-׿؀-ۿ]['׳]?$/,'');
  k=k.replace(/['"׳״]/g,'').trim();
  return k||m;
}
function groupClassesByGrade(names){
  const g=[];
  names.forEach(n=>{const k=gradeOfClass(n);let e=g.find(x=>x.grade===k);if(!e){e={grade:k,classes:[]};g.push(e);}e.classes.push(n);});
  return g;
}

/* ── School stage: elementary (grades 1–6) or middle school (grades 7–9) ──
   Detected from the grade field and the class-sheet names. Only when EVERY detected grade is
   elementary does the prompt switch to the elementary version; otherwise (middle school, mixed or
   unknown) the middle-school prompt is used exactly as before. */
function gradeNumber(token){
  let s=String(token||'').trim().toLowerCase()
    .replace(/[׳'"״]/g,'').replace(/^(الصف|صف|כיתה|class|grade)\s*/,'').replace(/^ال/,'').trim();
  if(!s) return null;
  const n=s.match(/^(\d{1,2})\b/); if(n) return Number(n[1]);
  const AR={'اول':1,'أول':1,'ثاني':2,'ثالث':3,'رابع':4,'خامس':5,'سادس':6,'سابع':7,'ثامن':8,'تاسع':9,'عاشر':10};
  const w=s.split(/\s+/)[0]; if(AR[w]) return AR[w];
  const HE={'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,'יא':11,'יב':12};
  if(HE[w]) return HE[w];
  return null;
}
function detectStage(teacher,classNames){
  const grades=[gradeNumber(teacher&&teacher.grade),...(classNames||[]).map(c=>gradeNumber(gradeOfClass(c)))].filter(x=>x!==null);
  if(grades.length&&grades.every(g=>g>=1&&g<=6)) return 'elem';
  return 'mid';
}

/* ═══════════ EXCEL READER ═══════════
   Reads any results workbook in the browser (nothing is uploaded):
   1) a workbook made by the class-screening platform (hidden "_meta" sheet) – read exactly;
   2) any other workbook – the structure of every sheet is detected: the question-number row,
      the section / skill / Bloom rows, the maximum-score row, the name columns and the student rows.
   Sheets with the same question structure form one "version" of the screening (e.g. ז1+ז2 took
   one exam, ז3+ז4 another, ח1–ח5 a third). Skills can also come from a separate mapping sheet. */

const KW={
  max:/قصو|كامل|max|מקס|ניקוד|נקוד|נק'|full|points|درجة السؤال|علامة السؤال|العلامة|العلامات|علامات|الدرجة|تقسيم|חלוקת/i,
  bloom:/بلوم|bloom|בלום|مستوى التفكير|رتبة|רמת חשיבה|thinking/i,
  section:/^(?:القسم|قسم|الفصل|الجزء|المجال|חלק|פרק|section|part)(?:\s|$|:)/i,
  skill:/مهار|skill|מיומנ|موضوع|topic|נושא|محور|תחום|domain|هدف|מטרה|objective|مضمون الهدف|content/i,
  qhead:/رقم السؤال|السؤال|سؤال|שאלה|מס'? ?שאלה|question|^q#?$|^no\.?$|^#$/i,
  cls:/^(?:الصف|صف|الشعبة|شعبة|כיתה|class|section|group)$/i,
  total:/مجموع|المجموع|العلامة النهائية|סה"?כ|סכה"?כ|סך הכל|ציון סופי|total|^sum$|النسبة|אחוז|percent|^%$/i,
  stop:/^(?:المعدل|معدل|المتوسط|متوسط|ממוצע|סה"?כ|סכה"?כ|المجموع|total|average|mean)/i
};
const BLOOM_WORDS=/^(تذكر|التذكر|معرفة|المعرفة|فهم|الفهم|استيعاب|تطبيق|التطبيق|تحليل|التحليل|تقييم|التقييم|تركيب|التركيب|إبداع|الإبداع|ابداع|ידע|זכירה|הבנה|יישום|ניתוח|הערכה|סינתזה|יצירה|remember|remembering|knowledge|understand|understanding|comprehension|apply|application|applying|analy[sz]e|analysis|analy[sz]ing|evaluate|evaluation|evaluating|create|creating|synthesis)$/i;
const QRX_PREFIX=/^(?:س|سؤال|السؤال|ش|ש|שאלה|ש'|q|question|ques|no\.?|#)\s*[.:#\-]?\s*(\d{1,3})(?:\s*[.\-\/]?\s*([a-zא-תأ-ي]|\d{1,2}))?\s*$/i;
const QRX_PLAIN=/^(\d{1,3})(?:\s*[.\-\/]?\s*(\d{1,2}|[a-zא-ת]|[أ-ي]ـ?|هـ))?$/i;

function txt(v){ if(v===null||v===undefined) return ''; return String(v).trim(); }
function num(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  const s=String(v).trim().replace(',', '.').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  if(!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return Number(s);
}
function isText(v){ const s=txt(v); return s!=='' && num(v)===null; }
function colLetter(c){ let s=''; c++; while(c>0){ const m=(c-1)%26; s=String.fromCharCode(65+m)+s; c=Math.floor((c-1)/26); } return s; }

/* sheet → array of rows at their real Excel positions, with merged cells filled in */
function sheetRows(ws){
  if(!ws||!ws['!ref']) return [];
  const R=XLSX.utils.decode_range(ws['!ref']);
  const raw=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});
  const A=[];
  for(let r=0;r<R.s.r;r++) A.push([]);
  raw.forEach(row=>A.push(new Array(R.s.c).fill(null).concat(row)));
  (ws['!merges']||[]).forEach(m=>{
    const v=(A[m.s.r]||[])[m.s.c];
    if(v===null||v===undefined) return;
    for(let r=m.s.r;r<=m.e.r;r++){ A[r]=A[r]||[]; for(let c=m.s.c;c<=m.e.c;c++){ if(A[r][c]===null||A[r][c]===undefined) A[r][c]=v; } }
  });
  return A;
}

/* ── platform workbook ── */
function readPlatformWorkbook(wb){
  const metaWs=wb.Sheets['_meta']; if(!metaWs) return null;
  let M; try{ M=JSON.parse(txt((metaWs['A1']||{}).v)); }catch(e){ return null; }
  if(!M||!M.qCount||!M.firstQCol) return null;
  const known=new Set(M.classes||[]);
  const reserved=new Set(['_meta',M.bandsSheet]);
  const hidden=(name)=>{const i=wb.SheetNames.indexOf(name);const h=wb.Workbook&&wb.Workbook.Sheets&&wb.Workbook.Sheets[i];return !!(h&&h.Hidden);};
  const cell=(A,r,c)=>(A[r-1]||[])[c-1];
  const looksLikeClass=(A)=>{ if(!M.maxRow) return false; for(let j=0;j<M.qCount;j++){ if(num(cell(A,M.maxRow,M.firstQCol+j))===null) return false; } return true; };
  const sheets=wb.SheetNames.filter(n=>!hidden(n)&&!reserved.has(n)).map(n=>({name:n,A:sheetRows(wb.Sheets[n])}))
    .filter(s=>known.has(s.name)||looksLikeClass(s.A));
  if(!sheets.length) return null;
  const A0=sheets[0].A;
  const questions=[];
  for(let j=0;j<M.qCount;j++){
    const C=M.firstQCol+j;
    questions.push({q:txt(cell(A0,M.qnRow,C))||String(j+1),skill:txt(cell(A0,M.tpRow,C)),bloom:txt(cell(A0,M.blRow,C)),section:txt(cell(A0,M.secRow,C)),max:num(cell(A0,M.maxRow,C)),col:colLetter(C-1)});
  }
  const classes=sheets.map(({name,A})=>{
    const students=[];
    for(let r=M.firstRow;r<=M.lastRow;r++){
      const vals=questions.map((q,j)=>num(cell(A,r,M.firstQCol+j)));
      if(vals.every(v=>v===null)) continue;
      students.push({name:txt(cell(A,r,2))||`#${r-M.firstRow+1}`,vals});
    }
    return {name,students};
  });
  let bands=null;
  const wsB=M.bandsSheet&&wb.Sheets[M.bandsSheet];
  if(wsB&&M.bandCount){
    const B=sheetRows(wsB), b=[];
    for(let i=0;i<M.bandCount;i++){ const r=M.bandsFirstRow+i; b.push({name:txt(cell(B,r,2)),min:num(cell(B,r,3)),max:num(cell(B,r,4))}); }
    if(b.every(x=>x.name&&x.min!==null)) bands=b.map(x=>({...x,max:x.max===null?'':x.max}));
  }
  const layout={qRow:M.qnRow,skillRow:M.tpRow,bloomRow:M.blRow,secRow:M.secRow,maxRow:M.maxRow,firstRow:M.firstRow,nameCol:'B',firstQCol:colLetter(M.firstQCol-1),lastQCol:colLetter(M.firstQCol+M.qCount-2)};
  return finish({source:'platform',versions:[{questions,classes,layout}],bands,ignored:wb.SheetNames.filter(n=>!sheets.find(s=>s.name===n)),notes:[],issues:[]});
}

/* ── generic workbook: detect the structure of one sheet ── */
function detectSheet(A){
  const R=Math.min(A.length,40);
  let best=null;
  for(let r=0;r<R;r++){
    const row=A[r]||[];
    const pref=[], plain=[];
    row.forEach((v,c)=>{ const s=txt(v); if(!s) return;
      if(QRX_PREFIX.test(s)) pref.push(c); else if(QRX_PLAIN.test(s)) plain.push(c); });
    let cols=null, score=0;
    if(pref.length>=2){ cols=pref.concat(plain).sort((a,b)=>a-b); score=pref.length*2+plain.length; }
    else if(plain.length>=3){
      /* a row of bare numbers is a header only if it starts at 1 and climbs (sections may restart at 1) */
      /* …and sits in neighbouring columns (the longest run of adjacent columns, at least 3) */
      let run=[plain[0]], bestRun=[plain[0]];
      for(let i=1;i<plain.length;i++){ if(plain[i]-plain[i-1]<=2) run.push(plain[i]); else run=[plain[i]]; if(run.length>bestRun.length) bestRun=run.slice(); }
      const ns=bestRun.map(c=>parseInt(txt(row[c]),10));
      let ok=0; for(let i=1;i<ns.length;i++){ if(ns[i]===ns[i-1]||ns[i]===ns[i-1]+1||ns[i]===1) ok++; }
      if(bestRun.length>=3&&ns[0]<=2&&ok>=ns.length-2){ cols=bestRun; score=bestRun.length; }
    }
    if(cols&&(!best||score>best.score)) best={r,cols,score};
  }
  if(!best) return null;
  const qRow=best.r;
  let qcols=best.cols.filter(c=>!KW.total.test(txt(A[qRow][c])));
  const minQ=qcols[0];
  const labels=(r,cols)=>{ const row=A[r]||[]; const out=[]; for(let c=0;c<row.length;c++){ if(cols.includes(c)) continue; if(isText(row[c])) out.push(txt(row[c])); } return out.join(' '); };
  const share=(r,cols,f)=>{ const row=A[r]||[]; return cols.filter(c=>f(row[c])).length/cols.length; };

  /* max-score row: a labelled row near the header, or the first all-numeric row without a name below it */
  let maxRow=-1;
  for(let r=Math.max(0,qRow-6);r<Math.min(A.length,qRow+8);r++){ if(r===qRow) continue; if(KW.max.test(labels(r,qcols))&&share(r,qcols,v=>num(v)!==null)>=.6){ maxRow=r; break; } }
  if(maxRow<0){
    for(let r=qRow+1;r<Math.min(A.length,qRow+4);r++){ const L=labels(r,qcols); if(share(r,qcols,v=>num(v)!==null)>=.8&&!L){ maxRow=r; break; } if(L) break; }
  }
  /* columns with a maximum score but no question number (e.g. writing: content / language / structure) are questions too;
     a column whose header says total, or whose maximum equals the sum of all others, is not */
  if(maxRow>=0){
    const mrow=A[maxRow]||[];
    const hdrRows=[]; for(let r=Math.max(0,qRow-4);r<=Math.max(qRow,maxRow);r++) if(r!==maxRow) hdrRows.push(r);
    const isTotal=(c)=>hdrRows.some(r=>KW.total.test(txt((A[r]||[])[c])));
    const cand=[]; for(let c=minQ;c<mrow.length;c++){ if(num(mrow[c])!==null&&!isTotal(c)) cand.push(c); }
    const sumOthers=(c)=>cand.filter(x=>x!==c).reduce((a,x)=>a+num(mrow[x]),0);
    qcols=cand.filter(c=>!(cand.length>2&&Math.abs(num(mrow[c])-sumOthers(c))<1e-6));
  }
  let totalCol=-1;
  { const lastQ=qcols[qcols.length-1]; const hdr=[]; for(let r=Math.max(0,qRow-4);r<=Math.max(qRow,maxRow<0?qRow:maxRow);r++) hdr.push(r);
    for(let c=lastQ+1;c<=lastQ+4&&totalCol<0;c++){ if(hdr.some(r=>KW.total.test(txt((A[r]||[])[c])))) totalCol=c; } }
  if(!qcols.length) return null;

  /* students: rows below the header with a name or scores, until an average / total row */
  const top=Math.max(qRow,maxRow);
  const nameCols=[]; for(let c=0;c<qcols[0];c++) nameCols.push(c);
  const nameOf=(r)=>nameCols.map(c=>(A[r]||[])[c]).filter(isText).map(txt).join(' ').replace(/\s+/g,' ').trim();
  const studentRows=[]; let firstStudent=-1;
  for(let r=top+1;r<A.length;r++){
    const nm=nameOf(r), vals=qcols.map(c=>num((A[r]||[])[c]));
    if(nm&&KW.stop.test(nm)) break;
    if(nm&&(KW.max.test(nm)||KW.qhead.test(nm))) continue;
    if(!nm&&vals.every(v=>v===null)) continue;
    if(firstStudent<0) firstStudent=r;
    const odd=qcols.filter(c=>{const v=(A[r]||[])[c];return v!==null&&v!==undefined&&txt(v)!==''&&num(v)===null;}).map(c=>colLetter(c));
    const typed=totalCol>=0?num((A[r]||[])[totalCol]):null;
    const over=maxRow>=0?qcols.filter((c,j)=>{const m=num((A[maxRow]||[])[c]);return vals[j]!==null&&m!==null&&vals[j]>m;}).map(c=>({cell:colLetter(c)+(r+1),v:num(A[r][c]),max:num(A[maxRow][c])})):[];
    studentRows.push({r,name:nm||`#${studentRows.length+1} (row ${r+1})`,vals,odd,typed,over});
  }
  if(firstStudent<0) return null;
  /* class column (all classes on one sheet) */
  let clsCol=-1;
  for(let r=Math.max(0,qRow-3);r<=top;r++){ (A[r]||[]).forEach((v,c)=>{ if(clsCol<0&&!qcols.includes(c)&&KW.cls.test(txt(v))) clsCol=c; }); }
  if(clsCol>=0) studentRows.forEach(s=>{ s.cls=txt((A[s.r]||[])[clsCol]); s.name=nameCols.filter(c=>c!==clsCol).map(c=>(A[s.r]||[])[c]).filter(isText).map(txt).join(' ')||s.name; });
  /* header rows: skill, Bloom, section */
  let bloomRow=-1, secRow=-1; const skillCands=[];
  for(let r=0;r<firstStudent;r++){
    if(r===qRow||r===maxRow) continue;
    const lab=labels(r,qcols), vals=qcols.map(c=>txt((A[r]||[])[c])).filter(Boolean);
    if(!vals.length) continue;
    const ts=vals.filter(v=>num(v)===null).length/qcols.length;
    const bloomish=vals.filter(v=>BLOOM_WORDS.test(v.replace(/\s+/g,' '))).length/vals.length;
    if(KW.bloom.test(lab)||(bloomish>=.6&&ts>=.4)){ if(bloomRow<0) bloomRow=r; continue; }
    if(KW.section.test(lab)){ if(secRow<0) secRow=r; continue; }
    if(KW.skill.test(lab)||ts>=.4) skillCands.push({r,kw:KW.skill.test(lab),n:vals.length,distinct:new Set(vals).size});
  }
  skillCands.sort((a,b)=>(b.kw-a.kw)||(b.distinct-a.distinct));
  const skillRow=skillCands.length?skillCands[0].r:-1;
  const subRow=skillCands.length>1&&skillCands[1].distinct>1?skillCands[1].r:-1;
  return {qRow,qcols,maxRow,skillRow,subRow,bloomRow,secRow,nameCols,clsCol,totalCol,firstStudent,studentRows};
}

/* a separate sheet mapping question number → skill (and maybe max / Bloom) */
function detectMapSheet(A){
  for(let r=0;r<Math.min(A.length,12);r++){
    const row=A[r]||[]; let qc=-1,sc=-1,mc=-1,bc=-1,sub=-1;
    row.forEach((v,c)=>{ const s=txt(v); if(!s) return;
      if(qc<0&&KW.qhead.test(s)) qc=c;
      else if(KW.bloom.test(s)) { if(bc<0) bc=c; }
      else if(KW.skill.test(s)) { if(sc<0) sc=c; else if(sub<0) sub=c; }
      else if(mc<0&&KW.max.test(s)) mc=c; });
    if(qc>=0&&sc>=0){
      const map={};
      for(let k=r+1;k<A.length;k++){ const q=txt((A[k]||[])[qc]); if(!q) continue;
        map[normQ(q)]={skill:txt(A[k][sc]),sub:sub>=0?txt(A[k][sub]):'',max:mc>=0?num(A[k][mc]):null,bloom:bc>=0?txt(A[k][bc]):''}; }
      if(Object.keys(map).length>=2) return map;
    }
  }
  return null;
}
function normQ(s){ const m=txt(s).match(/(\d{1,3})(?:\s*[.\-\/]?\s*(\d{1,2}|[a-zא-תأ-ي]ـ?|هـ))?\s*$/i); return m?(m[1]+(m[2]?m[2].toLowerCase():'')):txt(s); }

function questionsOf(f,map){
  const {A,d}=f;
  const get=(r,c)=>r>=0?txt((A[r]||[])[c]):'';
  const Q=d.qcols.map((c,j)=>{
    const label=get(d.qRow,c);
    const o={q:label||get(d.skillRow,c)||colLetter(c),label,skill:get(d.skillRow,c),sub:get(d.subRow,c),bloom:get(d.bloomRow,c),section:get(d.secRow,c),
      max:d.maxRow>=0?num((A[d.maxRow]||[])[c]):null,col:colLetter(c)};
    if(o.skill===o.section) o.skill='';
    if(o.skill&&o.skill===label&&num(label)===null) o.q=label;
    if(map){ const m=map[normQ(label)]; if(m){ if(!o.skill) o.skill=m.skill; if(!o.sub) o.sub=m.sub; if(o.max===null) o.max=m.max; if(!o.bloom) o.bloom=m.bloom; } }
    return o;
  });
  /* the same number in two sections (e.g. reading 1–12, grammar 1–3): name it with its section */
  const seen={}; Q.forEach(q=>{seen[q.q]=(seen[q.q]||0)+1;});
  if(Object.values(seen).some(n=>n>1)) Q.forEach(q=>{ if(q.section&&seen[q.q]>1) q.q=`${q.q} (${q.section.replace(/\s*\d+\s*%\s*$/,'')})`; });
  return Q;
}

function readGenericWorkbook(wb){
  const notes=[], issues=[];
  const hidden=(i)=>{const h=wb.Workbook&&wb.Workbook.Sheets&&wb.Workbook.Sheets[i];return !!(h&&h.Hidden);};
  const found=[], ignored=[]; let map=null, mapSheet='';
  const NOT_CLASS=/^(?:סיכום|סכום|ריכוז|תיקונים|הוראות|הערות|ملخص|الملخص|تلخيص|التصحيحات|تصحيحات|تعليمات|ملاحظات|summary|corrections|instructions|notes|readme)/i;
  wb.SheetNames.forEach((n,i)=>{
    if(hidden(i)||NOT_CLASS.test(n.trim())){ ignored.push(n); return; }
    const A=sheetRows(wb.Sheets[n]);
    const d=detectSheet(A);
    if(d&&d.studentRows.length) found.push({name:n,A,d});
    else { const m=detectMapSheet(A); if(m&&!map){ map=m; mapSheet=n; } else ignored.push(n); }
  });
  if(!found.length) return {source:'generic',error:'nostudents',ignored};
  /* group sheets with the same questions into versions of the screening */
  const groups=[];
  const same=(a,b)=>!a||!b||a===b;
  const fits=(G,Q)=>G.length===Q.length&&G.every((g,j)=>g.max===Q[j].max&&same(g.label,Q[j].label)&&same(g.skill,Q[j].skill));
  found.forEach(f=>{
    const Q=questionsOf(f,map);
    let g=groups.find(x=>fits(x.questions,Q));
    if(!g){ g={questions:Q,sheets:[]}; groups.push(g); }
    else Q.forEach((q,j)=>{ const G=g.questions[j]; ['label','skill','sub','bloom','section'].forEach(k=>{ if(!G[k]&&q[k]) G[k]=q[k]; }); if(!G.label&&q.label) G.q=q.q; else if(G.q===G.col&&q.label) G.q=q.q; });
    g.sheets.push(f);
  });
  const versions=groups.map((g,k)=>{
    const f0=g.sheets[0], d0=f0.d;
    let classes;
    if(g.sheets.length===1&&d0.clsCol>=0){
      const by={}; d0.studentRows.forEach(s=>{const key=s.cls||'?';(by[key]=by[key]||[]).push(s);});
      classes=Object.keys(by).map(key=>({name:key,students:by[key],sheet:f0.name}));
      notes.push(`all classes are on sheet "${f0.name}"; the class of each student is in column ${colLetter(d0.clsCol)}`);
    } else classes=g.sheets.map(f=>({name:f.name,students:f.d.studentRows,sheet:f.name}));
    classes.forEach(c=>{ c.students=c.students.filter(s=>!s.vals.every(v=>v===null)); });
    const L=(r)=>r>=0?r+1:null;
    const layout={qRow:L(d0.qRow),skillRow:L(d0.skillRow),subRow:L(d0.subRow),bloomRow:L(d0.bloomRow),secRow:L(d0.secRow),maxRow:L(d0.maxRow),firstRow:L(d0.firstStudent),
      nameCol:d0.nameCols.length?(d0.nameCols.length>1?`${colLetter(d0.nameCols[0])}–${colLetter(d0.nameCols[d0.nameCols.length-1])}`:colLetter(d0.nameCols[0])):'',
      firstQCol:colLetter(d0.qcols[0]),lastQCol:colLetter(d0.qcols[d0.qcols.length-1]),sheet:f0.name,mapSheet,oneSheet:g.sheets.length===1&&d0.clsCol>=0};
    const odd=[]; g.sheets.forEach(f=>f.d.studentRows.forEach(s=>{ if(s.odd&&s.odd.length) odd.push(`"${f.name}" row ${s.r+1} (${s.odd.join(', ')})`); }));
    if(odd.length) notes.push(`non-numeric score cells were read as 0: ${odd.slice(0,8).join('; ')}${odd.length>8?'…':''}`);
    g.sheets.forEach(f=>{ const sh=f.name, d=f.d;
      d.studentRows.forEach(s=>{
        s.over.forEach(o=>issues.push({type:'over',sheet:sh,cell:o.cell,v:o.v,max:o.max,name:s.name}));
        const empty=s.vals.every(v=>v===null);
        if(empty&&s.typed===0) issues.push({type:'absent0',sheet:sh,row:s.r+1,name:s.name});
        else if(!empty&&d.totalCol>=0){ const sum=s.vals.reduce((a,v)=>a+(v||0),0);
          if(s.typed===null) issues.push({type:'nototal',sheet:sh,row:s.r+1,name:s.name,sum});
          else if(Math.abs(sum-s.typed)>0.01) issues.push({type:'total',sheet:sh,row:s.r+1,name:s.name,sum,typed:s.typed}); }
      }); });
    return {questions:g.questions,classes,layout};
  });
  return finish({source:'generic',versions,bands:null,ignored,notes,issues});
}
function finish(res){
  res.classes=res.versions.flatMap(v=>v.classes);
  res.questions=res.versions[0].questions;   /* first version, for simple uses */
  return res;
}

function readWorkbook(arrayBuffer){
  const wb=XLSX.read(arrayBuffer,{type:'array',cellDates:false});
  return readPlatformWorkbook(wb)||readGenericWorkbook(wb);
}

/* ── figures for the cross-check (only for versions where every maximum score is known) ── */
function computeFigures(res,bands){
  const vs=res.versions.map(v=>{
    const Q=v.questions; if(!Q.length||Q.some(q=>!(q.max>0))) return null;
    const totalMax=Q.reduce((a,q)=>a+q.max,0);
    const pt=(s,j)=>Math.min(Math.max(s.vals[j]||0,0),Q[j].max);
    const classes=v.classes.map(c=>{
      const pcts=c.students.map(s=>Q.reduce((a,q,j)=>a+pt(s,j),0)/totalMax*100);
      return {name:c.name,n:pcts.length,average:pcts.length?pcts.reduce((a,b)=>a+b,0)/pcts.length:0,counts:buildDist(pcts,bands),pcts};
    });
    const agg=(key)=>{ const o={}; Q.forEach((q,j)=>{ const k=q[key]; if(!k) return; o[k]=o[k]||{got:0,max:0}; v.classes.forEach(c=>c.students.forEach(s=>{ o[k].got+=pt(s,j); o[k].max+=Q[j].max; })); });
      return Object.keys(o).map(k=>({name:k,pct:o[k].max?Math.round(o[k].got/o[k].max*1000)/10:0})); };
    return {totalMax,classes,bySkill:agg('skill'),bySection:agg('section'),byBloom:agg('bloom')};
  });
  if(vs.every(x=>!x)) return null;
  const all=vs.filter(Boolean).flatMap(v=>v.classes.flatMap(c=>c.pcts));
  return {versions:vs,n:all.length,average:all.length?all.reduce((a,b)=>a+b,0)/all.length:0,counts:buildDist(all,bands),complete:vs.every(Boolean)};
}

/* issues re-checked against the current maximum scores (the teacher may correct a maximum on the platform) */
function liveIssues(res){
  const iss=res.issues||[]; if(!iss.length) return iss;
  const maxOf={};
  res.versions.forEach(v=>v.classes.forEach(c=>{ v.questions.forEach(q=>{ maxOf[(c.sheet||c.name)+'|'+q.col]=q.max; }); }));
  return iss.map(i=>{ if(i.type!=='over') return i; const col=i.cell.replace(/\d+$/,''); const m=maxOf[i.sheet+'|'+col];
    if(m===undefined||m===null) return i; return i.v>m?{...i,max:m}:null; }).filter(Boolean);
}

/* ═══════════ SUMMARY-REPORT PROMPT FOR ANY RESULTS FILE ═══════════
   Same report structure as the class-screening platform (detailed Excel + short Word דוח מסכם),
   but built from the teacher's details and the structure this page read from the attached file. */
const LOGO="https://i.postimg.cc/SNgVgv8L/my-new-icon.png";
const BRAND={ar:'ومضات ذكية مع منى مصطفى',he:'ברקים חכמים עם מונא מוסטפא'};
const brandOf=(l)=>BRAND[l]||BRAND.ar;
/* the grade the teacher chose decides the stage; the class names are used only if no grade was chosen */
function stageOf(teacher,classes){ const g=gradeNumber(teacher&&teacher.grade); if(g!==null) return g<=6?'elem':'mid'; return detectStage(teacher,classes); }

function otherSubject(name,out,stage){
  const AR=out==='ar';
  return {
    out, subj:name,
    title:AR?`تحليل نتائج المسح الصفي في ${name}`:`ניתוח תוצאות המבדק הכיתתי ב${name}`,
    expert:`an expert in pedagogical assessment and educational data analysis, specialising in teaching ${name} in ${stage==='elem'?'elementary schools (grades א–ו)':'middle schools (grades ז, ח, ט)'} in Arab schools in Israel, and familiar with the ${name} curriculum and the skills tested in class screenings`,
    langRules:AR?`- All outputs (the Excel file and the Word file) are written in Modern Standard Arabic: headings, skill names, explanations, insights, recommendations, sheet names and chart labels.
- Exception: the title of the insight boxes and the footer are written in Hebrew, exactly as given below.
- Keep student names and class names exactly as they appear in the file.`:`- All outputs (the Excel file and the Word file) are written in Hebrew: headings, skill names, explanations, insights, recommendations, sheet names and chart labels.
- Question topics or skill names in the file may be written in Arabic. Read and understand them, and present them in Hebrew in the outputs (you may add the original name in brackets).
- Keep student names and class names exactly as they appear in the file.`,
    skillsTitle:'A. The skills and their mapping to the questions',
    skills:`2) Use the skill each question addresses exactly as the file gives it (table above), and group the questions by these skills. Do not change an existing classification.
3) Only if a question has no skill in the file, assign it by its content to the most suitable skill already appearing in the file; if none fits, use a suitable skill from the ${name} curriculum for this grade, and record this in the notes sheet.
4) If the skills in the file are very detailed, also group them into a few main skills (main skill ← sub-skill), using the standard curriculum terms.
5) For each grade, build a table linking: question number ← skill as in the file ← main skill ← Bloom level (if in the file) ← maximum score.`,
    skillExtra:'',
    recos:`for the teacher (a support plan for every weak skill with ${stage==='elem'?'age-appropriate ':''}teaching strategies, group work and a suggested timetable, and reinforcement of mastered skills)`,
    team:`for the school's ${name} staff`,
    notes:AR?'ملاحظات وافتراضات':'הערות והנחות', support:AR?'طلاب الدعم':'תלמידים לתמיכה'
  };
}

function buildReportPrompt({res,figures,teacher,subject,otherName,otherLang,bands,statedClasses}){
  const classes=(res&&res.classes||[]).map(c=>c.name).filter(Boolean);
  const STAGE=stageOf(teacher,classes);
  let S;
  if(subject==='other') S=otherSubject(otherName||'the subject',otherLang||'he',STAGE);
  else { const S0=REPORT_SUBJECTS[subject]||REPORT_SUBJECTS.arabic; S=STAGE==='elem'?{...S0,...(REPORT_ELEM[subject]||{})}:S0; }
  const AR=S.out==='ar', OUT=AR?'Arabic':'Hebrew';
  const B=bands, nb=B.length;
  const nm=(i)=>`"${B[i].name}" (${bandRangeLabel(B,i)})`;
  const low=nm(0), low2=nb>1?nm(1):low, top=nm(nb-1);
  const U=S.topicUnit?'topic':'skill', Us=S.topicUnit?'topics':'skills';
  const groups=groupClassesByGrade(classes);
  const multi=groups.length>1;
  const bandLines=B.map((b,i)=>`   • ${nm(i)}`).join('\n');
  const colorLines=B.map((b,i)=>`   - ${nm(i)}: #${bandLight(B,i)}`).join('\n');
  const V=(res&&res.versions)||[];
  const allQ=V.flatMap(v=>v.questions);
  const hasBloom=allQ.some(q=>q.bloom), hasSkill=allQ.some(q=>q.skill), hasSec=allQ.some(q=>q.section);
  const skillGaps=V.some(v=>v.questions.some(q=>!q.skill));
  const meta=[teacher.name&&`teacher: ${teacher.name}`,teacher.school&&`school: ${teacher.school}`,teacher.gradeLabel&&`grade: ${teacher.gradeLabel}`,teacher.date&&`date: ${teacher.date}`].filter(Boolean).join(', ');
  const skillNote=S.skillNote||'';
  const stageTxt=STAGE==='elem'?'elementary school':'middle school';
  const NOTES=S.notes;

  /* ── file structure section ── */
  let structure;
  if(V.length&&allQ.length){
    const where=(v)=>{ const L=v.layout, cl=v.classes.map(c=>`"${c.name}"`).join(', ');
      const rows=[`question numbers in row ${L.qRow}`,L.secRow&&`section in row ${L.secRow}`,L.skillRow&&`the skill/topic of each question in row ${L.skillRow}`,L.subRow&&`sub-skill in row ${L.subRow}`,
        L.bloomRow&&`Bloom level in row ${L.bloomRow}`,L.maxRow&&`maximum score in row ${L.maxRow}`].filter(Boolean).join(', ');
      if(res.source==='platform') return `class sheets ${cl}; ${rows}; questions in columns ${L.firstQCol}–${L.lastQCol}, student names in column ${L.nameCol}, students from row ${L.firstRow}.`;
      if(L.oneSheet) return `all students on sheet "${L.sheet}", with a class column giving the classes ${cl}; ${rows}; questions in columns ${L.firstQCol}–${L.lastQCol}, student names in column(s) ${L.nameCol}, students from row ${L.firstRow}.`;
      return `class sheets ${cl} (the sheet name IS the class name); ${rows}; questions in columns ${L.firstQCol}–${L.lastQCol}, student names in column(s) ${L.nameCol}${/–/.test(L.nameCol)?' (join them: first name, father\'s name, family name)':''}, students from row ${L.firstRow}.`; };
    const table=(v)=>{ const Q=v.questions, sub=Q.some(q=>q.sub), bl=Q.some(q=>q.bloom), sec=Q.some(q=>q.section);
      const total=Q.every(q=>q.max>0)?Q.reduce((a,q)=>a+q.max,0):null;
      return `   Question map (${Q.length} questions${total!==null?`, total ${total} points`:''}):
   Column | Question${sec?' | Section':''} | Skill / topic as in the file${sub?' | Sub-skill':''}${bl?' | Bloom level':''} | Max score
${Q.map(q=>`   ${q.col} | ${q.q}${sec?` | ${q.section||'—'}`:''} | ${q.skill||'—'}${sub?` | ${q.sub||'—'}`:''}${bl?` | ${q.bloom||'—'}`:''} | ${q.max!==null&&q.max!==undefined?q.max:'?'}`).join('\n')}`; };
    const head=res.source==='platform'
      ? `- The file was produced by the class-screening platform. The platform read it as follows:`
      : `- The file was prepared by the teacher (its layout is not fixed). The platform read it as follows:`;
    const vers=V.length===1
      ? `- ${where(V[0])}\n${table(V[0])}`
      : `- The file contains ${V.length} DIFFERENT versions of the screening (different questions or maximum scores). Analyse each class against its own version:\n`+V.map((v,k)=>`\n  Version ${k+1} – ${where(v)}\n${table(v)}`).join('\n');
    const ign=(res.ignored||[]).length?`\n- Other sheets (${res.ignored.map(s=>`"${s}"`).join(', ')}): not class data (instructions, summaries, ranges or hidden sheets). Do not treat them as classes. If one of them holds averages or range counts calculated in the school, compare them with your results and explain any difference in "${NOTES}" (see section E).`:'';
    const extra=(res.notes||[]).length?`\n- Platform notes: ${res.notes.join('; ')}.`:'';
    const edited=allQ.some(q=>q.edited)?`\n- The teacher reviewed the question map on the platform (some skills or maximum scores were completed or corrected). Where it differs from the file, use the map and record this in "${NOTES}".`:'';
    const noSkill=skillGaps?`\n- Where the skill is "—", the file gives only the section: classify the question yourself by its section and by the curriculum framework in part A, and list your classification in the question-mapping sheet.`:'';
    const qMax=allQ.some(q=>q.max===null||q.max===undefined)?`\n- Where the maximum score is "?", it is not stated in the file: find it in the file if you can; otherwise take the highest score any student received in that question, and record the assumption in "${NOTES}".`:'';
    const iss=liveIssues(res);
    const issLines=[];
    const over=iss.filter(i=>i.type==='over'), ab=iss.filter(i=>i.type==='absent0'), tot=iss.filter(i=>i.type==='total'), nt=iss.filter(i=>i.type==='nototal');
    if(over.length) issLines.push(`   • ${over.length} score(s) above the question's maximum (probably entry errors – or a wrong maximum in the header, if many students in one column exceed it): ${over.map(i=>`"${i.sheet}" ${i.cell} = ${i.v} (max ${i.max}, ${i.name})`).join('; ')}. Count each such score as the maximum, as the platform did.`);
    if(ab.length) issLines.push(`   • ${ab.length} student(s) with no scores but a total of 0 typed in the file – absent, not zero: ${ab.map(i=>`"${i.sheet}" row ${i.row} (${i.name})`).join('; ')}. Do not count them.`);
    if(tot.length) issLines.push(`   • ${tot.length} typed total(s) that differ from the sum of the question scores: ${tot.map(i=>`"${i.sheet}" row ${i.row} (${i.name}): sum ${i.sum}, typed ${i.typed}`).join('; ')}. Use the sum of the question scores.`);
    if(nt.length) issLines.push(`   • ${nt.length} student(s) with scores but no typed total: ${nt.map(i=>`"${i.sheet}" row ${i.row} (${i.name})`).join('; ')}. Count them, using the sum of their scores.`);

    structure=`${head}

  } else {
    structure=`- The file was prepared by the teacher and its layout is not fixed. First identify: the class sheets (or a class column), the question-number row, the row giving the skill/topic each question addresses, the Bloom level (if any), the maximum score of each question, the student-name column(s) and the student rows. If different classes took different versions of the screening, analyse each against its own questions. Ignore instruction, summary and hidden sheets. Record what you identified in "${NOTES}".

  }

    : `- The teacher stated that the file contains ${stated} classes, but the platform found ${classes.length} (${classes.map(c=>`"${c}"`).join(', ')}). Check the file: analyse every class that has student scores, and explain the difference in "${NOTES}".`):'';
  const versionRule=V.length>1?`\n- Classes that took DIFFERENT versions of the screening (even in the same grade) are compared on averages, range distribution and shared ${Us} only – never question by question – and the report states this limit.`:'';

  let check='';
  if(figures){

    const dist=B.map((b,i)=>`${b.name}: ${figures.counts[i]} (${pct(figures.counts[i],figures.n)}%)`).join(', ');
    const lines=figures.versions.map((v,k)=>{ if(!v) return `   Version ${k+1}: not calculated (some maximum scores are missing).`;

      const by=(arr,label)=>arr.length&&arr.length<=30?`\n   - Success rate by ${label}: ${arr.map(g=>`${g.name}: ${g.pct}%`).join(', ')}`:'';

    check=`
${RULE}
E. Cross-check: figures the platform calculated from the same file
${RULE}
(Absent students excluded; scores above a question's maximum counted as the maximum; percentages out of the version's total.)

${lines}

`;
  }

  return `You are ${S.expert}.

⚠️ Important before you start:

- Classes of the same grade that took the same version have the same structure and question order, so compare the same question and the same ${U} directly between them.

${RULE}
${S.skillsTitle}
${RULE}
1) ${hasSkill?`The file gives the ${U} each question addresses (the question map in section 0)${hasBloom?' and its Bloom level':''}. Keep them as they are and base the classification on them.`:`The file does not give a ${U} for the questions. Classify every question yourself, by its content and wording in the file, using the framework below.`}${hasBloom?'':' The file has no Bloom level: wherever the steps below mention the Bloom level "as in the file", leave it out (do not invent one).'}

${S.skills}

B. Required analysis (for each grade level separately)
${RULE}
1) Student scores and averages:
   - Calculate each student's total score as a percentage (out of 100).

2) ${S.analysisTitle||'Skills analysis'}:
${S.analysisCalc||'   - Calculate the success rate in every main skill and sub-skill, in every class and for the whole grade.\n   - Classify the skills:'}
     • Low achievement – needs a support plan: below 55%.

${hasBloom?'   - Also calculate the success rate for each Bloom level as it appears in the file.\n':''}   - Identify the hardest and easiest questions (lowest and highest success rate)${S.causeEx||', and explain pedagogically the likely cause of difficulty.'}
${S.skillExtra}

${nb>1?`     • Students in the range ${low2} (support and follow-up).\n`:''}     • Students whose score is one standard deviation or more below their class average, even if they are in a higher range.

   - For each student give: name, grade, class, total score, range, gap from the class average, the ${Us} needing support, and priority level (high / medium).

   5. General summary and recommendations: one page at most, in bullet points.

   Word formatting:
   - Page and text direction right-to-left (RTL), clear professional ${AR?'Modern Standard Arabic':'standard Hebrew'}.

${check}
- Check every calculation before presenting it; never estimate a number.
- Make sure the numbers and charts in the Word file are identical to those in the Excel file.
- Before delivering, confirm that the footer really appears on every page of the Word file, and that the Hebrew box title "${REPORT_INSIGHTS}" is written correctly.

⚠️ Final reminder: do not ask any question, do not present a plan awaiting approval, and do not stop midway. Complete the whole analysis and deliver the detailed Excel file and the summary Word file together.`;

/* ═══════════ INTERVENTION-PLAN PROMPT (תוכנית התערבות) ═══════════

function planSubject(subject,otherName){
  const names={arabic:'Arabic language',hebrew:'Hebrew',english:'English',science:'Science and Technology',math:'Mathematics'};
  return subject==='other'?(otherName||'the subject'):(names[subject]||'the subject');
}
function planOut(subject,otherLang){ if(subject==='other') return otherLang||'he'; return subject==='arabic'?'ar':'he'; }

function buildPlanPrompt({teacher,subject,otherName,otherLang,plan,bands}){
  const CL=(plan.classes||[]).filter(Boolean), many=CL.length>1, none=!CL.length;

  const progs=(plan.programs||[]).filter(p=>p.name&&p.name.trim());
  const progLines=progs.length?progs.map(p=>`   • ${p.name.trim()}: ${p.hours||'?'} lesson(s) per student per week${p.who?` – for: ${p.who}`:''}${p.staff?` – delivered by: ${p.staff}`:''}`).join('\n'):'   • (no additional programs – the plan relies on the regular lessons only)';
  const weeks=(()=>{ if(!plan.from||!plan.to) return null; const d=(new Date(plan.to)-new Date(plan.from))/864e5; return d>0?Math.round(d/7):null; })();
  const monitor=(plan.monitor||[]).concat(plan.monitorOther?[plan.monitorOther]:[]).filter(Boolean);
  const bandTxt=bands&&bands.length?bands.map((b,i)=>`"${b.name}" (${bandRangeLabel(bands,i)})`).join(', '):'';
  const meta=[teacher.name&&`teacher: ${teacher.name}`,teacher.school&&`school: ${teacher.school}`,`class${many||none?'es':''}: ${none?'all in the report':CL.join(', ')}`].filter(Boolean).join(', ');
  const hasTpl=!!plan.templateName, hasRep=!!plan.reportName;

  return `You are an expert in pedagogical intervention and differentiated teaching, specialising in ${subj} in ${stageTxt} (${STAGE==='elem'?'grades א–ו':'grades ז, ח, ט'}) in Arab schools in Israel, and experienced in writing intervention plans (תוכנית התערבות) that close learning gaps after a class screening.

⚠️ Important before you start:
Carry out everything directly, without asking any question or waiting for approval. If anything is ambiguous, make the most pedagogically appropriate decision yourself, list your assumptions in a short "${T.notes}" section at the end of the plan, and complete the plan to the end. (The only exception: if the summary report is not attached to this message, write one line asking for it and stop.)

1. ${hasRep?`"${plan.reportName}" – `:''}the summary report (דוח מסכם) of the class screening in ${subj}${hasRep?'':' (the Word or PDF file produced in the previous stage; if the detailed Excel analysis is also attached, use it for names and exact figures)'}.

${progLines}

- A subtle footer on EVERY page without exception: small (8–9 pt), light-grey text, not bold, centred, containing exactly the platform name:
  ${brandOf(out)}

- Before delivering, confirm that the footer with the logo really appears on every page.
- Check that the hours in the plan add up to the hours available${many||none?' in each class':''} and that every student named in the report as high priority${many||none?' in each of these classes':''} appears in a group.

⚠️ Final reminder: do not ask any question and do not stop midway. Deliver the complete intervention plan as a Word file.`;

/* ── file ── */
function renderFile(){
  const t=T(), r=st.res;
  let h=`<label class="drop" id="dropZone"><input type="file" id="xl" accept=".xlsx,.xlsm,.xls" hidden>
    <div class="big">📂</div><b>${st.fileName?`<bdi>${esc(st.fileName)}</bdi>`:t.drop}</b><div class="muted">${t.dropSub}</div></label>`;
  if(st.readErr) h+=`<div class="warn">⚠️ ${esc(st.readErr)}<br><button class="link" id="skipRead">${t.skip}</button></div>`;
  if(r&&r.versions){
    const stated=Number(st.nClasses)||0, cls=r.classes, V=r.versions;
    h+=`<div class="sum"><p class="ok">✓ ${r.source==='platform'?t.readPlatform:t.readOk}</p>
    <p><b>${t.found} (${cls.length}):</b> ${cls.map(c=>`<span class="chip"><bdi>${esc(c.name)}</bdi> · ${c.students.length} ${t.students}</span>`).join(' ')}</p>
    ${stated&&stated!==cls.length?`<p class="warn">⚠️ ${fmt(t.mismatch,{'%1':stated,'%2':cls.length})}</p>`:''}
    ${(r.ignored||[]).length?`<p class="muted">${t.ignored} ${r.ignored.map(x=>`<bdi>${esc(x)}</bdi>`).join(' · ')}</p>`:''}
    ${issuesBox()}
    ${V.length>1?`<p class="note">ℹ️ ${fmt(t.versionsNote,{'%1':V.length})}</p>`:''}
    <p>${t.qReview}</p>
    ${V.map((v,k)=>{ const Q=v.questions, bl=Q.some(q=>q.bloom); let last=null;
      return `${V.length>1?`<h4>${fmt(t.version,{'%1':k+1})}: ${v.classes.map(c=>`<bdi>${esc(c.name)}</bdi>`).join(' · ')} <span class="muted">· ${fmt(t.qCount,{'%1':Q.length})}</span></h4>`:`<p><b>${fmt(t.qCount,{'%1':Q.length})}</b></p>`}
      <div class="qwrap"><table class="qt"><thead><tr><th>${t.colQ}</th><th>${t.colSkill}</th>${bl?`<th>${t.colBloom}</th>`:''}<th class="mx">${t.colMax}</th></tr></thead><tbody>
      ${Q.map((q,j)=>{ const head=q.section&&q.section!==last?`<tr class="sech"><td colspan="${bl?4:3}"><bdi>${esc(q.section)}</bdi></td></tr>`:''; last=q.section;
        return head+`<tr class="${!q.skill||!(q.max>0)?'miss':''}"><td><b><bdi>${esc(q.label||q.q)}</bdi></b></td>
        <td><input data-v="${k}" data-q="${j}" data-f="skill" value="${esc(q.skill)}" placeholder="${t.skillPh}" dir="auto"></td>
        ${bl?`<td class="bl"><input data-v="${k}" data-q="${j}" data-f="bloom" value="${esc(q.bloom)}" placeholder="—" dir="auto"></td>`:''}
        <td class="mx"><input data-v="${k}" data-q="${j}" data-f="max" type="number" min="0" value="${q.max??''}" placeholder="?"></td></tr>`; }).join('')}
      </tbody></table></div>`; }).join('')}
    ${r.questions&&V.some(v=>v.questions.some(q=>!q.skill))?`<p class="muted">${t.noSkill}</p>`:''}
    ${V.some(v=>v.questions.some(q=>!(q.max>0)))?`<p class="muted">${t.noMax}</p>`:''}</div>`;
  }
  $('#file').innerHTML=h;
}

function issuesBox(){
  const iss=liveIssues(st.res); if(!iss.length) return '';
  const t=T(), c={}; iss.forEach(i=>{c[i.type]=(c[i.type]||0)+1;});
  const lines=[['over',t.issOver],['absent0',t.issAbs],['total',t.issTot],['nototal',t.issNoTot]].filter(([k])=>c[k]).map(([k,s])=>`<li>${fmt(s,{'%N':c[k]})}</li>`).join('');
  const what=(i)=>i.type==='over'?fmt(t.dOver,{'%V':i.v,'%M':i.max}):i.type==='absent0'?t.dAbs:i.type==='total'?fmt(t.dTot,{'%S':i.sum,'%T':i.typed}):fmt(t.dNoTot,{'%S':i.sum});
  const rows=iss.map(i=>`<tr><td><bdi>${esc(i.sheet)}</bdi></td><td dir="ltr">${i.cell||`${t.row} ${i.row}`}</td><td><bdi>${esc(i.name)}</bdi></td><td>${what(i)}</td></tr>`).join('');
  return `<div class="warn" id="issues"><b>⚠️ ${t.issTitle}</b><ul>${lines}</ul><p class="muted">${t.issHint}</p>
    <details><summary>${t.issMore}</summary><div class="det"><table><thead><tr><th>${t.cSheet}</th><th>${t.cWhere}</th><th>${t.cName}</th><th>${t.cWhat}</th></tr></thead><tbody>${rows}</tbody></table></div></details></div>`;
}

  return `<ol class="steps">${steps.map((s,i)=>`<li><span>${i+1}</span><div>${s}</div></li>`).join('')}</ol>
  <div class="row"><button class="cta" data-copy="${id}">${t.copy}</button>
  <a class="cta2" href="https://claude.ai/new" target="_blank" rel="noopener">${t.open}</a>

  <p class="copied" id="cp-${id}"></p><pre id="pre-${id}" hidden>${esc(PROMPTS[id])}</pre>
  <p class="muted">${t.privacy}</p>`;
}
function reportBlocked(){
  const t=T();
  if(!st.teacher.grade) return t.needGrade;
  if(st.subject==='other'&&!st.otherName.trim()) return t.needOther;
  if(validateBands(st.bands)) return t.needBands;
  if(!st.res&&!st.skipRead) return t.needFile;
  return '';
}
function renderReportPrompt(){
  const t=T(), blocked=reportBlocked();

  PROMPTS.report=blocked?'':buildReportPrompt({res,figures:res?computeFigures(res,st.bands):null,teacher:st.teacher,subject:st.subject,otherName:st.otherName,otherLang:st.otherLang,bands:st.bands,statedClasses:st.nClasses});

}

function planBlocked(){
  const t=T(), P=st.plan;
  if(!st.teacher.grade) return t.needGradeTop;
  if(st.subject==='other'&&!st.otherName.trim()) return t.needOtherTop;
  if(!P.weekly) return t.needWeekly;
  if(!P.from||!P.to) return t.needPeriod;
  if(new Date(P.to)<=new Date(P.from)) return t.badPeriod;
  if(!P.monitor.length&&!P.monitorOther.trim()) return t.needMon;
  return '';
}
function renderPlanPrompt(){
  const t=T(), blocked=planBlocked(), P=st.plan;
  PROMPTS.plan=blocked?'':buildPlanPrompt({teacher:st.teacher,subject:st.subject,otherName:st.otherName,otherLang:st.otherLang,plan:P,bands:validateBands(st.bands)?null:st.bands});
  $('#pprompt').innerHTML=promptCard('plan',[t.rs1,fmt(t.ps2,{'%R':P.reportName?` (<bdi><b>${esc(P.reportName)}</b></bdi>)`:'','%T':P.templateName?fmt(t.psTpl,{'%N':`<bdi><b>${esc(P.templateName)}</b></bdi>`}):''}),t.ps3],blocked);
}
function renderTabs(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===st.tab));
  $('#s-report').hidden=st.tab!=='report'; $('#s-plan').hidden=st.tab!=='plan';
}
function renderAll(){
  document.documentElement.lang=st.lang||'ar'; document.documentElement.dir=st.lang?T().dir:'rtl';
  if(!st.lang){ renderSplash(); return; }
  renderShell(); renderTeacher(); renderBands(); renderFile(); renderReportPrompt(); renderPlan(); renderPlanPrompt(); renderTabs();
}
function refreshPrompts(){ renderReportPrompt(); renderPlanPrompt(); }

/* ── reading the file ── */
async function handleFile(f){
  if(!f) return;
  const t=T();
  st.fileName=f.name; st.readErr=''; st.res=null; st.skipRead=false;
  try{
    if(typeof XLSX==='undefined') throw new Error('lib');
    const res=readWorkbook(await f.arrayBuffer());
    if(res.error||!res.questions||!res.classes.some(c=>c.students.length)) st.readErr=t.errStruct;
    else {
      st.res=res;
      if(res.bands&&!validateBands(normalizeBands(res.bands))){ st.bands=normalizeBands(res.bands); st.nb=st.bands.length; st.bandsTouched=true; }
      if(!st.nClasses) st.nClasses=String(res.classes.length);
    }
  }catch(e){ console.error(e); st.readErr=e.message==='lib'?t.errLib:t.errRead; }
  renderAll();
}

/* ── events ── */
document.addEventListener('input',e=>{
  const el=e.target, d=el.dataset;
  if(d.t){ st.teacher[d.t]=el.value; refreshPrompts(); return; }
  if(el.id==='otherName'){ st.otherName=el.value; refreshPrompts(); return; }
  if(el.id==='nClasses'){ st.nClasses=el.value; renderFile(); refreshPrompts(); return; }
  if(d.b!==undefined){ const b=st.bands[+d.b]; b[d.f]=d.f==='name'?el.value:(el.value===''?'':Number(el.value)); st.bandsTouched=true;
    const hadErr=!!$('#bands .err'); refreshPrompts();
    if(!!validateBands(st.bands)!==hadErr){ renderBands(); const n=$(`#bands [data-b="${d.b}"][data-f="${d.f}"]`); if(n){ n.focus(); } }
    return; }
  if(d.q!==undefined){ const q=st.res.versions[+d.v].questions[+d.q]; q[d.f]=d.f==='max'?(el.value===''?null:Number(el.value)):el.value; q.edited=true;
    el.closest('tr').classList.toggle('miss',!q.skill||!(q.max>0)); refreshPrompts();
    if(d.f==='max'){ const box=$('#issues'), open=box&&box.querySelector('details').open, html=issuesBox();
      if(box){ if(html){ box.outerHTML=html; if(open) $('#issues details').open=true; } else box.remove(); } }
    return; }
  if(d.p!==undefined){ st.plan.programs[+d.p][d.f]=el.value; renderPlanPrompt(); return; }
  const pm={'p-cls':'clsDraft','p-weekly':'weekly','p-from':'from','p-to':'to','p-mo':'monitorOther','p-extra':'extra'};
  if(pm[el.id]){ st.plan[pm[el.id]]=el.value; renderPlanPrompt(); }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='subject'){ st.subject=el.value; if(!st.bandsTouched) resetBands(); renderAll(); }
  else if(el.id==='otherLang'){ st.otherLang=el.value; if(!st.bandsTouched) resetBands(); renderAll(); }
  else if(el.id==='grade'){ const i=GRADE_HE.indexOf(el.value); st.teacher.grade=el.value; st.teacher.gradeLabel=i>=0?gradeLabel(i):''; renderTeacher(); refreshPrompts(); }
  else if(el.id==='xl'){ handleFile(el.files[0]); el.value=''; }
  else if(el.id==='p-rep'){ st.plan.reportName=el.files[0]?el.files[0].name:''; renderPlan(); renderPlanPrompt(); }
  else if(el.id==='p-tpl'){ st.plan.templateName=el.files[0]?el.files[0].name:''; renderPlan(); renderPlanPrompt(); }
  else if(el.dataset.m!==undefined){ const v=MONITOR_EN[+el.dataset.m]; st.plan.monitor=el.checked?[...st.plan.monitor,v]:st.plan.monitor.filter(x=>x!==v); renderPlanPrompt(); }
});
document.addEventListener('click',e=>{
  const el=e.target.closest('button'); if(!el) return;
  const d=el.dataset, t=T();
  if(d.lang){ st.lang=d.lang; renderAll(); window.scrollTo(0,0); return; }
  if(d.tab){ st.tab=d.tab; renderTabs(); $('#tabs').scrollIntoView({behavior:'smooth'}); return; }
  if(d.nb){ st.nb=+d.nb; resetBands(); st.bandsTouched=true; renderBands(); refreshPrompts(); return; }
  if(el.id==='bandReset'){ resetBands(); st.bandsTouched=false; renderBands(); refreshPrompts(); return; }
  if(el.id==='skipRead'){ st.skipRead=true; st.readErr=''; renderFile(); refreshPrompts(); return; }
  if(d.pc!==undefined){ const c=d.pc, L=st.plan.classes; st.plan.classes=L.includes(c)?L.filter(x=>x!==c):[...L,c]; renderPlan(); renderPlanPrompt(); return; }
  if(el.id==='pcAll'){ st.plan.classes=[...new Set([...(st.res&&st.res.classes||[]).map(c=>c.name),...st.plan.classes])]; renderPlan(); renderPlanPrompt(); return; }
  if(el.id==='pcNone'){ st.plan.classes=[]; renderPlan(); renderPlanPrompt(); return; }
  if(el.id==='pcAdd'){ addDraftClasses(); return; }
  if(el.id==='addProg'){ st.plan.programs.push({name:'',hours:'',who:'',staff:''}); renderPlan(); return; }
  if(d.del!==undefined){ st.plan.programs.splice(+d.del,1); if(!st.plan.programs.length) st.plan.programs.push({name:'',hours:'',who:'',staff:''}); renderPlan(); renderPlanPrompt(); return; }
  if(el.id==='p-tpl-x'){ st.plan.templateName=''; renderPlan(); renderPlanPrompt(); return; }
  if(d.toggle){ const p=$('#pre-'+d.toggle); p.hidden=!p.hidden; el.textContent=p.hidden?t.show:t.hide; return; }
  if(d.copy){ copyText(PROMPTS[d.copy],d.copy); return; }
});
function addDraftClasses(){
  const parts=st.plan.clsDraft.split(/[,،;\n]+/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return;
  st.plan.classes=[...new Set([...st.plan.classes,...parts])]; st.plan.clsDraft='';
  renderPlan(); renderPlanPrompt(); const i=$('#p-cls'); if(i) i.focus();
}
document.addEventListener('keydown',e=>{ if(e.target.id==='p-cls'&&e.key==='Enter'){ e.preventDefault(); addDraftClasses(); } });
function copyText(text,id){
  const t=T();
  const done=()=>{ const n=$('#cp-'+id); n.textContent=t.copied; setTimeout(()=>n.textContent='',4000); };
  const fb=()=>{ const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;top:-9999px;opacity:0'; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} document.body.removeChild(ta);
    if(ok) done(); else { const p=$('#pre-'+id); p.hidden=false; const r=document.createRange(); r.selectNodeContents(p); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $('#cp-'+id).textContent=t.copyManual; } };
  try{ navigator.clipboard.writeText(text).then(done,fb); }catch(_){ fb(); }
}
document.addEventListener('dragover',e=>{ if(e.target.closest('#dropZone')) e.preventDefault(); });
document.addEventListener('drop',e=>{ if(e.target.closest('#dropZone')){ e.preventDefault(); handleFile(e.dataTransfer.files[0]); } });
renderAll();

</script>
